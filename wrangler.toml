name = "fitfocus"
compatibility_date = "2026-02-17"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ✅ DEFAULT (Pages/Production): ВСЕГДА реальная база
[[d1_databases]]
binding = "DB"
database_name = "fitfocus-dev"
database_id = "061ae786-9341-4bd7-8efe-025dd1bac6d5"
migrations_dir = "migrations"

# ✅ LOCAL DEV (только если запускаешь wrangler с --env local)
[env.local]
[[env.local.d1_databases]]
binding = "DB"
database_name = "fitfocus_local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"