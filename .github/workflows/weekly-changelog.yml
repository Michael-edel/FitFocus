name: Weekly Changelog

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  weekly-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly changelog issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const now = new Date();
            const since = new Date(now);
            since.setDate(since.getDate() - 7);

            const sinceIso = since.toISOString().slice(0, 10);
            const untilIso = now.toISOString().slice(0, 10);
            const title = `Weekly changelog: ${sinceIso} → ${untilIso}`;

            const searchQuery = `repo:${owner}/${repo} is:pr is:merged merged:>=${sinceIso}`;
            const searchResult = await github.rest.search.issuesAndPullRequests({
              q: searchQuery,
              per_page: 100,
            });

            const prs = (searchResult.data.items || [])
              .filter((item) => item.pull_request)
              .sort((a, b) => new Date(b.closed_at || b.updated_at) - new Date(a.closed_at || a.updated_at));

            if (prs.length === 0) {
              core.info(`No merged pull requests from ${sinceIso} to ${untilIso}; skipping issue creation.`);
              return;
            }

            const lines = [];
            lines.push('# Weekly changelog');
            lines.push(`Period: ${sinceIso} to ${untilIso}`);
            lines.push('');
            lines.push('Merged pull requests:');
            lines.push('');
            for (const pr of prs) {
              lines.push(`- [#${pr.number}](${pr.html_url}) ${pr.title}`);
            }

            lines.push('');
            lines.push('_Generated automatically by GitHub Actions._');

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open "${title}"`,
              per_page: 10,
            });

            const existingIssue = (existing.data.items || []).find((item) => item.title === title);
            if (existingIssue?.number) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existingIssue.number,
                body: lines.join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: lines.join('\n'),
              });
            }
