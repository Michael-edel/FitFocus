name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

# Feature/fix branches are validated by pull_request; push runs are reserved for main/dev.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Schema parity
        run: npm run check:schema

      - name: Privacy coverage
        run: npm run check:privacy

      - name: Auth scope
        run: npm run check:auth-scope

      - name: API invariants
        run: npm run check:api-invariants

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Domain strict typecheck
        run: npm run typecheck:domain-strict

      - name: Storage strict typecheck
        run: npm run typecheck:storage-strict

      - name: Build
        run: npm run build

      - name: Browser tests (local mock API)
        env:
          FITFOCUS_ROLLBACK_ARTIFACT: ${{ runner.temp }}/fitfocus-rollback-a6b2048
        run: npm run test:e2e:mock -- --workers=1

      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fitfocus-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package immutable candidate
        env:
          FITFOCUS_CANDIDATE_ARTIFACT: ${{ runner.temp }}/fitfocus-candidate
        run: npm run release:build -- --source "$(git rev-parse HEAD)" --output "$FITFOCUS_CANDIDATE_ARTIFACT"

      - name: Canonical readers and CAS after server rollback
        env:
          FITFOCUS_ROLLBACK_ARTIFACT: ${{ runner.temp }}/fitfocus-rollback-a6b2048
          FITFOCUS_CANDIDATE_ARTIFACT: ${{ runner.temp }}/fitfocus-candidate
        run: npm run release:check -- "$FITFOCUS_ROLLBACK_ARTIFACT" --retained-source a6b2048bb94b4550013662b18c778f88b785798d --candidate "$FITFOCUS_CANDIDATE_ARTIFACT"

      - name: Verify pre-DDL API and atomic D1 migration
        env:
          FITFOCUS_CANDIDATE_ARTIFACT: ${{ runner.temp }}/fitfocus-candidate
        run: node scripts/check-family-planning-rollout.mjs --candidate "$FITFOCUS_CANDIDATE_ARTIFACT"

      - name: Retain tested rollback artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fitfocus-rollback-a6b2048-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitfocus-rollback-a6b2048.tar
          if-no-files-found: error
          retention-days: 90

      - name: Retain tested candidate artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fitfocus-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitfocus-candidate.tar
          if-no-files-found: error
          retention-days: 90
