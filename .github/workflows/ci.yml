name: CI

on:
  push:
    branches:
      - main
      - dev
      - feature/**
      - fix/**
  pull_request:

permissions:
  contents: read

# A push to an open pull request triggers both events. Keep one current run per branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Dependency audit
        run: npm audit

      - name: Schema parity
        run: npm run check:schema

      - name: Privacy coverage
        run: npm run check:privacy

      - name: Auth scope
        run: npm run check:auth-scope

      - name: API invariants
        run: npm run check:api-invariants

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Domain strict typecheck
        run: npm run typecheck:domain-strict

      - name: Storage strict typecheck
        run: npm run typecheck:storage-strict

      - name: Build
        run: npm run build

      - name: Browser tests (local mock API)
        env:
          FITFOCUS_ROLLBACK_ARTIFACT: ${{ runner.temp }}/fitfocus-rollback-98d4910
        run: npm run test:e2e:mock

      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fitfocus-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Canonical readers and CAS after server rollback
        env:
          FITFOCUS_ROLLBACK_ARTIFACT: ${{ runner.temp }}/fitfocus-rollback-98d4910
        run: npm run release:check -- "$FITFOCUS_ROLLBACK_ARTIFACT"

      - name: Retain tested rollback artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fitfocus-rollback-98d4910-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitfocus-rollback-98d4910.tar
          if-no-files-found: error
          retention-days: 90
