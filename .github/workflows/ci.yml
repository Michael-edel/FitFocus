name: CI

on:
  push:
    branches:
      - main
      - dev
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit

      - name: Schema parity
        run: npm run check:schema

      - name: Privacy coverage
        run: npm run check:privacy

      - name: Auth scope
        run: npm run check:auth-scope

      - name: API invariants
        run: npm run check:api-invariants

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
