<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      CSP: блокируем неожиданные сторонние скрипты (например, инъекции расширениями/плагинами),
      но оставляем то, что реально нужно этому проекту (Tailwind CDN + esm.sh importmap).
      Это убирает Cloudflare Access/Perplexity редиректы и похожие сюрпризы в консоли.
    -->
    <!--
      DEV NOTE: Strict CSP inside index.html breaks Vite dev (HMR websocket + React refresh)
      and may cause blank screens / "Failed to fetch" while the dev server is up.
      Keep CSP for production via server headers at deploy time.
    -->
    <title>FitFocus</title>
    <meta name="theme-color" content="#020617" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>FF</text></svg>">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Tailwind CDN (AI Studio needs this because it doesn't run PostCSS build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            borderRadius: { 
              xl: '1rem', 
              '2xl': '1.25rem',
              '3xl': '2rem',
              '4xl': '2.5rem',
              '5xl': '3rem'
            },
            colors: { slate: { 950: '#020617' } }
          }
        }
      }
    </script>

<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@^3.8.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "vite-plugin-pwa": "https://esm.sh/vite-plugin-pwa@^1.2.0",
    "clsx": "https://esm.sh/clsx@^2.1.1"
  }
}
</script>
    <!-- Keep local CSS: Inter font + custom styles -->
    <link rel="stylesheet" href="/index.css">
</head>
<body class="selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
